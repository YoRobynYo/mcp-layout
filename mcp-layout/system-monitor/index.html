<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ghibli System Monitor</title>
    <link rel="stylesheet" href="dist/main.css">
</head>
<body>
    <div class="monitor-container">
        <h1>System Monitor</h1>
        <div class="metric">
            <p>CPU Usage:</p>
            <span id="cpu-usage">--%</span>
        </div>
        <div class="metric">
            <p>Free RAM:</p>
            <span id="free-ram">-- GB</span>
        </div>
        <div class="metric">
            <p>Total RAM:</p>
            <span id="total-ram">-- GB</span>
        </div>
        <div class="metric">
            <p>Uptime:</p>
            <span id="uptime">--</span>
        </div>
        <div class="metric">
            <p>Network (Rx/Tx):</p>
            <span id="net-rx">-- KB/s</span> / <span id="net-tx">-- KB/s</span>
        </div>
        <div class="metric">
            <p>Disk Used/Total:</p>
            <span id="disk-used">-- GB</span> / <span id="disk-total">-- GB</span>
        </div>
    </div>
    <script src="js/app.js"></script>
</body>
</html>
