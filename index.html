<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MCP-AI-Panel - 3D Cube Corner Layout</title>
  <link rel="stylesheet" href="./css/style.css" />
</head>

<body>
  <div class="dashboard-layout">
    <!-- Center Stage for Opened Apps -->
    <div id="center-stage" class="center-stage">
      <div id="center-panel" class="panel panel--main">
        <div class="welcome-msg">
          <h2>SYSTEM ONLINE</h2>
          <p>Select a module from the corner nodes to begin.</p>
        </div>
      </div>
    </div>

    <!-- Top Left Cube: SYSTEM & APPS -->
    <div id="cube-tl" class="cube-container tl">
      <div class="screen-1-cube cube">
        <div class="face front">
          <div class="face-grid">
            <div class="grid-cell">
              <div class="face-label">SYSTEMS CONTROL</div>
            </div>
            <div class="grid-cell"></div>
            <div class="grid-cell">
              <div class="face-value">ACTIVE</div>
            </div>
            <div class="grid-cell">
              <button class="face-btn">REBOOT</button>
            </div>
          </div>
        </div>
        <div class="face back">
          <div class="face-grid">
            <div class="grid-cell">
              <div class="face-label">YOUTUBE</div>
            </div>
            <div class="grid-cell"></div>
            <div class="grid-cell">
              <div class="face-value">READY</div>
            </div>
            <div class="grid-cell">
              <button class="face-btn">LAUNCH</button>
            </div>
          </div>
        </div>
        <div class="face right">
          <div class="face-grid">
            <div class="grid-cell">
              <div class="face-label">S1-R</div>
            </div>
            <div class="grid-cell"></div>
            <div class="grid-cell"></div>
            <div class="grid-cell"></div>
          </div>
        </div>
        <div class="face left">
          <div class="face-grid">
            <div class="grid-cell">
              <div class="face-label">S1-L</div>
            </div>
            <div class="grid-cell"></div>
            <div class="grid-cell"></div>
            <div class="grid-cell"></div>
          </div>
        </div>
        <div class="face top">
          <div class="face-grid">
            <div class="grid-cell">
              <div class="face-label">S1-T</div>
            </div>
            <div class="grid-cell"></div>
            <div class="grid-cell"></div>
            <div class="grid-cell"></div>
          </div>
        </div>
        <div class="face bottom">
          <div class="face-grid">
            <div class="grid-cell">
              <div class="face-label">S1-B</div>
            </div>
            <div class="grid-cell"></div>
            <div class="grid-cell"></div>
            <div class="grid-cell"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Top Right Cube: NETWORK & COMMS -->
    <div id="cube-tr" class="cube-container tr">
      <div class="screen-2-cube cube">
        <div class="face front">
          <div class="face-grid">
            <div class="grid-cell">
              <div class="face-label">NETWORK</div>
            </div>
            <div class="grid-cell"></div>
            <div class="grid-cell">
              <div class="face-value">SECURE</div>
            </div>
            <div class="grid-cell"></div>
          </div>
        </div>
        <div class="face back">
          <div class="face-grid">
            <div class="grid-cell"></div>
            <div class="grid-cell"></div>
            <div class="grid-cell"></div>
            <div class="grid-cell"></div>
          </div>
        </div>
        <div class="face right">
          <div class="face-grid">
            <div class="grid-cell"></div>
            <div class="grid-cell"></div>
            <div class="grid-cell"></div>
            <div class="grid-cell"></div>
          </div>
        </div>
        <div class="face left">
          <div class="face-grid">
            <div class="grid-cell"></div>
            <div class="grid-cell"></div>
            <div class="grid-cell"></div>
            <div class="grid-cell"></div>
          </div>
        </div>
        <div class="face top">
          <div class="face-grid">
            <div class="grid-cell"></div>
            <div class="grid-cell"></div>
            <div class="grid-cell"></div>
            <div class="grid-cell"></div>
          </div>
        </div>
        <div class="face bottom">
          <div class="face-grid">
            <div class="grid-cell"></div>
            <div class="grid-cell"></div>
            <div class="grid-cell"></div>
            <div class="grid-cell"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Bottom Left Cube: SECURITY & DEFENSE -->
    <div id="cube-bl" class="cube-container bl">
      <div class="screen-3-cube cube">
        <div class="face front">
          <div class="face-grid">
            <div class="grid-cell">
              <div class="face-label">SECURITY</div>
            </div>
            <div class="grid-cell"></div>
            <div class="grid-cell">
              <div class="face-value">LOCKED</div>
            </div>
            <div class="grid-cell"></div>
          </div>
        </div>
        <div class="face back">
          <div class="face-grid">
            <div class="grid-cell"></div>
            <div class="grid-cell"></div>
            <div class="grid-cell"></div>
            <div class="grid-cell"></div>
          </div>
        </div>
        <div class="face right">
          <div class="face-grid">
            <div class="grid-cell"></div>
            <div class="grid-cell"></div>
            <div class="grid-cell"></div>
            <div class="grid-cell"></div>
          </div>
        </div>
        <div class="face left">
          <div class="face-grid">
            <div class="grid-cell"></div>
            <div class="grid-cell"></div>
            <div class="grid-cell"></div>
            <div class="grid-cell"></div>
          </div>
        </div>
        <div class="face top">
          <div class="face-grid">
            <div class="grid-cell"></div>
            <div class="grid-cell"></div>
            <div class="grid-cell"></div>
            <div class="grid-cell"></div>
          </div>
        </div>
        <div class="face bottom">
          <div class="face-grid">
            <div class="grid-cell"></div>
            <div class="grid-cell"></div>
            <div class="grid-cell"></div>
            <div class="grid-cell"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Extra Free Panels (hidden by default to avoid blocking clicks) -->
    <div class="panel panel--transparent" id="screen-4" style="display:none">Panel 4</div>
    <div class="panel panel--transparent" id="screen-5" style="display:none">Panel 5</div>
  </div>

  <div class="controls">
    <div class="cube-selection">
      <button class="screen-btn active" data-target="cube-tl">Top Left</button>
      <button class="screen-btn" data-target="cube-tr">Top Right</button>
      <button class="screen-btn" data-target="cube-bl">Bottom Left</button>
    </div>
    <div class="rotation-controls">
      <button class="rotate-btn" data-action="up">Up</button>
      <button class="rotate-btn" data-action="down">Down</button>
      <button class="rotate-btn" data-action="left">Left</button>
      <button class="rotate-btn" data-action="right">Right</button>
      <button id="reset-btn">Reset</button>
    </div>
  </div>

  <script src="./src/js/cube-controls.js"></script>
  <script src="./src/js/dragPanels.js"></script>
</body>

</html>
