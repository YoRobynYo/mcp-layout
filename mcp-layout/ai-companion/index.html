<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Companion</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 50%, #16213e 100%);
      color: #ffffff;
      overflow: hidden;
    }

    .app-container {
      display: grid;
      grid-template-columns: 240px 420px 1fr;
      grid-gap: 30px;
      height: 100vh;
      padding: 20px;
      position: relative;
    }

    .app-container::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: radial-gradient(circle at 20% 80%, rgba(120, 119, 198, 0.1), transparent),
        radial-gradient(circle at 80% 20%, rgba(255, 119, 198, 0.1), transparent),
        radial-gradient(circle at 40% 40%, rgba(120, 200, 255, 0.05), transparent);
      pointer-events: none;
      z-index: 0;
    }

    /* Left Settings Panel */
    .settings-panel {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      padding: 24px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      position: relative;
      z-index: 1;
      overflow-y: auto;
      overflow-x: hidden;
    }

    .settings-panel::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      border-radius: 20px;
      padding: 1px;
      background: linear-gradient(45deg, rgba(120, 180, 255, 0.3), rgba(255, 120, 180, 0.3));
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: exclude;
      mask-composite: exclude;
      z-index: -1;
    }

    .settings-title {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 24px;
      background: linear-gradient(135deg, #64b5ff, #9c88ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .setting-group {
      margin-bottom: 20px;
    }

    .setting-label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 8px;
      color: rgba(255, 255, 255, 0.9);
    }

    .setting-select,
    .setting-input {
      width: 100%;
      padding: 12px 16px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      color: white;
      font-size: 14px;
      transition: all 0.3s ease;
      word-wrap: break-word;
    }

    .setting-select:focus,
    .setting-input:focus {
      outline: none;
      border-color: #64b5ff;
      box-shadow: 0 0 0 3px rgba(100, 181, 255, 0.2);
      background: rgba(255, 255, 255, 0.15);
    }

    .setting-button {
      width: 100%;
      padding: 12px 20px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border: none;
      border-radius: 12px;
      color: white;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
    }

    .setting-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(102, 126, 234, 0.6);
    }

    .setting-button:active {
      transform: translateY(0);
    }

    .voice-toggle {
      background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
      box-shadow: 0 4px 15px rgba(17, 153, 142, 0.4);
    }

    .voice-toggle:hover {
      box-shadow: 0 8px 25px rgba(17, 153, 142, 0.6);
    }

    /* Chat Panel */
    .chat-panel {
      display: flex;
      flex-direction: column;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      overflow: hidden;
      position: relative;
      z-index: 1;
    }

    .chat-header {
      padding: 20px 24px;
      background: linear-gradient(135deg, rgba(100, 181, 255, 0.2), rgba(156, 136, 255, 0.2));
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .chat-title {
      font-size: 18px;
      font-weight: 700;
      background: linear-gradient(135deg, #64b5ff, #9c88ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .chat-messages {
      flex: 1;
      padding: 24px;
      overflow-y: auto;
      min-height: 300px;
      max-height: 400px;
    }

    .message {
      display: flex;
      margin-bottom: 16px;
      animation: messageSlide 0.3s ease-out;
    }

    @keyframes messageSlide {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .message.user {
      justify-content: flex-end;
    }

    .message.ai {
      justify-content: flex-start;
    }

    .message-bubble {
      max-width: 80%;
      padding: 12px 18px;
      border-radius: 18px;
      font-size: 14px;
      line-height: 1.4;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      word-wrap: break-word;
    }

    .user .message-bubble {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      border-bottom-right-radius: 4px;
    }

    .ai .message-bubble {
      background: linear-gradient(135deg, #11998e, #38ef7d);
      color: white;
      border-bottom-left-radius: 4px;
    }

    .chat-input-container {
      padding: 24px;
      background: rgba(0, 0, 0, 0.2);
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }

    .chat-input-wrapper {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .chat-input {
      flex: 1;
      padding: 14px 20px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 25px;
      color: white;
      font-size: 14px;
      transition: all 0.3s ease;
    }

    .chat-input:focus {
      outline: none;
      border-color: #64b5ff;
      box-shadow: 0 0 0 3px rgba(100, 181, 255, 0.2);
      background: rgba(255, 255, 255, 0.15);
    }

    .chat-input::placeholder {
      color: rgba(255, 255, 255, 0.6);
    }

    .send-button {
      padding: 14px 24px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      border: none;
      border-radius: 25px;
      color: white;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
    }

    .send-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(102, 126, 234, 0.6);
    }

    .send-button:active {
      transform: translateY(0);
    }

    /* Avatar Panel */
    .avatar-panel {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      position: relative;
      z-index: 1;
    }

    .avatar-container {
      width: 220px;
      height: 220px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
    }

    .avatar {
      width: 200px;
      height: 200px;
      clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
      -webkit-clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(90px 90px at 50% 40%, rgba(255, 255, 255, 0.18), rgba(255, 255, 255, 0.04));
      border: 1px solid rgba(255, 255, 255, 0.14);
      position: relative;
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.35), inset 0 0 28px rgba(255, 255, 255, 0.06);
    }

    .avatar::before {
      content: '';
      position: absolute;
      inset: -3px;
      padding: 3px;
      background: conic-gradient(from 0deg, #7f8cff, #58d5ff, #7fffd4, #ffc36b, #7f8cff);
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      clip-path: inherit;
      -webkit-clip-path: inherit;
      animation: spin 8s linear infinite;
      opacity: 0.7;
    }

    .avatar::after {
      content: '';
      position: absolute;
      inset: 10px;
      background: radial-gradient(100px 100px at 50% 40%, rgba(120, 180, 255, 0.10), rgba(120, 180, 255, 0.02));
      filter: blur(4px);
      clip-path: inherit;
      -webkit-clip-path: inherit;
      animation: innerPulse 3s ease-in-out infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes innerPulse {

      0%,
      100% {
        opacity: 0.5;
      }

      50% {
        opacity: 0.85;
      }
    }

    #viz {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .orb {
      position: absolute;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #fff, rgba(255, 255, 255, 0.2));
      box-shadow: 0 0 10px rgba(120, 200, 255, 0.9);
      opacity: 0.8;
      animation: orbit 6s linear infinite;
      transform-origin: -50% -50%;
      top: 50%;
      left: 50%;
    }

    .orb.o2 {
      width: 8px;
      height: 8px;
      animation-duration: 8s;
      opacity: 0.7;
    }

    .orb.o3 {
      width: 6px;
      height: 6px;
      animation-duration: 10s;
      opacity: 0.6;
    }

    @keyframes orbit {
      0% {
        transform: rotate(0deg) translateX(70px) rotate(0deg);
      }

      100% {
        transform: rotate(360deg) translateX(70px) rotate(-360deg);
      }
    }

    .status-display {
      text-align: center;
      padding: 16px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      margin-top: 12px;
      font-size: 13px;
      color: rgba(255, 255, 255, 0.8);
    }

    .portrait {
      width: 60%;
      height: 50%;
      max-width: 95vmin;
      max-height: 95vmin;
      border-radius: 16px;
      overflow: hidden;
      position: relative;
      display: none;
      box-shadow: 0 14px 40px rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: radial-gradient(50% 35% at 50% 10%, rgba(127, 200, 255, 0.12), rgba(127, 200, 255, 0.02));
    }

    .portrait img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scale(1.02);
      filter: contrast(1.03) saturate(1.06);
    }

    /* Scrollbar styling */
    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 3px;
    }

    ::-webkit-scrollbar-thumb {
      background: linear-gradient(135deg, #667eea, #764ba2);
      border-radius: 3px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: linear-gradient(135deg, #764ba2, #667eea);
    }

    /* Responsive design */
    @media (max-width: 1200px) {
      .app-container {
        grid-template-columns: 200px 380px 1fr;
        grid-gap: 20px;
        padding: 15px;
      }
    }

    @media (max-width: 900px) {
      .app-container {
        grid-template-columns: 1fr;
        grid-template-rows: auto auto auto;
        overflow-y: auto;
      }

      .avatar-container {
        width: 180px;
        height: 180px;
      }

      .avatar {
        width: 160px;
        height: 160px;
      }
    }
  </style>
</head>

<body>
  <div class="app-container">
    <!-- Settings Panel -->
    <div class="settings-panel">
      <h2 class="settings-title">Settings</h2>

      <div class="setting-group">
        <label class="setting-label" for="mode-select">Style Mode</label>
        <select id="mode-select" class="setting-select">
          <option value="visualizer">Visualizer</option>
          <option value="portrait">Portrait</option>
        </select>
      </div>

      <div class="setting-group">
        <label class="setting-label" for="mode-image">Image URL (Portrait)</label>
        <input id="mode-image" type="text" class="setting-input" placeholder="Enter image URL...">
      </div>

      <div class="setting-group">
        <button id="mode-apply" class="setting-button">Apply Style</button>
      </div>

      <div class="setting-group">
        <label class="setting-label" for="voice-select">Voice</label>
        <select id="voice-select" class="setting-select"></select>
      </div>

      <div class="setting-group">
        <label class="setting-label" for="voice-rate">Speech Rate</label>
        <input id="voice-rate" type="range" class="setting-input" min="0.6" max="1.4" step="0.05" value="1.0">
      </div>

      <div class="setting-group">
        <button id="voice-toggle" class="setting-button voice-toggle">Unmute</button>
      </div>
    </div>

    <!-- Chat Panel -->
    <div class="chat-panel">
      <div class="chat-header">
        <h3 class="chat-title">AI Companion</h3>
      </div>

      <div id="conversation" class="chat-messages">
        <!-- Messages will be added here dynamically -->
      </div>

      <div class="chat-input-container">
        <div class="chat-input-wrapper">
          <input id="chat-input" type="text" class="chat-input" placeholder="Type your message...">
          <button id="send-btn" class="send-button">Send</button>
        </div>
      </div>
    </div>

    <!-- Avatar Panel -->
    <div class="avatar-panel">
      <div class="avatar-container">
        <div class="avatar" id="avatar">
          <canvas id="viz"></canvas>
          <div class="orb"></div>
          <div class="orb o2"></div>
          <div class="orb o3"></div>
        </div>
        <div class="portrait" id="portrait">
          <img id="portrait-img" alt="Portrait">
        </div>
      </div>

      <div id="status" class="status-display">Ready</div>
    </div>
  </div>

  <script>
    (function () {
      const { ipcRenderer } = require('electron');

      // Get DOM elements
      const status = document.getElementById('status');
      const canvas = document.getElementById('viz');
      const ctx = canvas.getContext('2d');
      const portrait = document.getElementById('portrait');
      const portraitImg = document.getElementById('portrait-img');
      const modeSelect = document.getElementById('mode-select');
      const modeImage = document.getElementById('mode-image');
      const modeApply = document.getElementById('mode-apply');
      const conversation = document.getElementById('conversation');
      const chatInput = document.getElementById('chat-input');
      const sendBtn = document.getElementById('send-btn');
      const voiceToggleBtn = document.getElementById('voice-toggle');
      const voiceSelect = document.getElementById('voice-select');
      const voiceRate = document.getElementById('voice-rate');

      // Canvas setup
      function resizeCanvas() {
        const dpr = window.devicePixelRatio || 1;
        const rect = canvas.getBoundingClientRect();
        canvas.width = Math.round(rect.width * dpr);
        canvas.height = Math.round(rect.height * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      resizeCanvas();
      window.addEventListener('resize', resizeCanvas);

      // Visualization variables
      let speakLevel = 0.25;
      let targetLevel = 0.25;
      let t = 0;
      const bars = 48;

      // Animation loop
      function draw() {
        const w = canvas.clientWidth;
        const h = canvas.clientHeight;
        ctx.clearRect(0, 0, w, h);

        speakLevel += (targetLevel - speakLevel) * 0.08;

        const cx = w / 2;
        const cy = h / 2;
        const baseR = Math.min(w, h) * 0.30;
        const maxR = Math.min(w, h) * 0.45;

        // Halo
        const grd = ctx.createRadialGradient(cx, cy, baseR * 0.6, cx, cy, maxR);
        grd.addColorStop(0, 'rgba(130,180,255,0.15)');
        grd.addColorStop(1, 'rgba(130,180,255,0.02)');
        ctx.fillStyle = grd;
        ctx.beginPath();
        ctx.arc(cx, cy, maxR, 0, Math.PI * 2);
        ctx.fill();

        // Radial bars
        for (let i = 0; i < bars; i++) {
          const a = (i / bars) * Math.PI * 2;
          const n = Math.sin(t * 0.03 + i * 0.45) * 0.5 + 0.5;
          const amp = 0.15 + speakLevel * 0.85;
          const r = baseR + n * (maxR - baseR) * amp;
          const x0 = cx + Math.cos(a) * baseR;
          const y0 = cy + Math.sin(a) * baseR;
          const x1 = cx + Math.cos(a) * r;
          const y1 = cy + Math.sin(a) * r;

          const lg = ctx.createLinearGradient(x0, y0, x1, y1);
          lg.addColorStop(0, 'rgba(127,140,255,0.00)');
          lg.addColorStop(0.7, 'rgba(127,220,255,0.75)');
          lg.addColorStop(1, 'rgba(127,255,212,0.95)');
          ctx.strokeStyle = lg;
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.moveTo(x0, y0);
          ctx.lineTo(x1, y1);
          ctx.stroke();
        }

        // Core pulse
        ctx.fillStyle = 'rgba(255,255,255,0.08)';
        ctx.beginPath();
        ctx.arc(cx, cy, baseR * (0.92 + 0.06 * Math.sin(t * 0.05)), 0, Math.PI * 2);
        ctx.fill();

        t += 1;
        requestAnimationFrame(draw);
      }

      requestAnimationFrame(draw);

      // Voice functionality
      let voiceEnabled = JSON.parse(localStorage.getItem('ai_voice_enabled') || 'true');
      let preferredVoice = localStorage.getItem('ai_voice_name') || '';
      let preferredRate = parseFloat(localStorage.getItem('ai_voice_rate') || '1.0');

      if (!isFinite(preferredRate)) preferredRate = 1.0;
      voiceRate.value = String(preferredRate);
      voiceToggleBtn.textContent = voiceEnabled ? 'Unmute' : 'Muted';

      function populateVoices() {
        const voices = speechSynthesis.getVoices();
        voiceSelect.innerHTML = '';
        const enVoices = voices.filter(v => /en[-_]/i.test(v.lang));
        const list = enVoices.length ? enVoices : voices;

        list.forEach(v => {
          const opt = document.createElement('option');
          opt.value = v.name;
          opt.textContent = `${v.name} (${v.lang})`;
          if (preferredVoice && preferredVoice === v.name) opt.selected = true;
          voiceSelect.appendChild(opt);
        });

        if (!preferredVoice && list[0]) {
          preferredVoice = list[0].name;
        }
      }

      if (speechSynthesis.getVoices().length === 0) {
        speechSynthesis.onvoiceschanged = populateVoices;
      } else {
        populateVoices();
      }

      // Voice controls
      voiceToggleBtn.addEventListener('click', () => {
        voiceEnabled = !voiceEnabled;
        localStorage.setItem('ai_voice_enabled', JSON.stringify(voiceEnabled));
        voiceToggleBtn.textContent = voiceEnabled ? 'Unmute' : 'Muted';
        if (!voiceEnabled) {
          try { speechSynthesis.cancel(); } catch (_) { }
          targetLevel = 0.25;
          status.textContent = 'Voice off';
        }
      });

      voiceSelect.addEventListener('change', () => {
        preferredVoice = voiceSelect.value;
        localStorage.setItem('ai_voice_name', preferredVoice);
      });

      voiceRate.addEventListener('input', () => {
        preferredRate = parseFloat(voiceRate.value || '1.0');
        localStorage.setItem('ai_voice_rate', String(preferredRate));
      });

      function speak(line) {
        if (!voiceEnabled) {
          status.textContent = 'Voice off';
          return;
        }
        if (!('speechSynthesis' in window)) {
          status.textContent = 'Speech not available';
          return;
        }

        const utter = new SpeechSynthesisUtterance(line);
        utter.rate = preferredRate || 1.0;
        utter.pitch = 1.0;
        utter.volume = 1.0;

        const voices = speechSynthesis.getVoices();
        const selected = voices.find(v => v.name === preferredVoice);
        if (selected) utter.voice = selected;
        else if (voices[0]) utter.voice = voices[0];

        utter.onstart = () => {
          status.textContent = `Speaking... (${utter.voice ? utter.voice.name : 'default'})`;
          targetLevel = 1.0;
        };
        utter.onend = () => {
          status.textContent = 'Ready';
          targetLevel = 0.25;
        };

        try { speechSynthesis.cancel(); } catch (_) { }
        speechSynthesis.speak(utter);
      }

      // AI Response function
      function generateReply(userText) {
        const u = (userText || '').toLowerCase().trim();
        if (!u) return 'How can I help?';

        if (/^(hi|hello|hey)\b/.test(u)) return "Hello! What would you like to do today?";
        if (/your name|who are you/.test(u)) return "I'm your AI companion, here to help with various tasks.";
        if (/what (can|do) (you|u) do/.test(u)) return "I can chat with you, control my appearance modes, and provide assistance.";
        if (/mute|unmute|voice/.test(u)) return "You can control my voice using the settings panel.";
        if (/help|how/.test(u)) return "Try asking me questions or use the settings to customize my appearance!";

        return `You said: "${userText}". I'm here to help with whatever you need!`;
      }

      // Chat functionality
      const history = [];

      function appendMessage(role, text) {
        const messageDiv = document.createElement('div');
        messageDiv.className = `message ${role}`;

        const bubbleDiv = document.createElement('div');
        bubbleDiv.className = 'message-bubble';
        bubbleDiv.textContent = text;

        messageDiv.appendChild(bubbleDiv);
        conversation.appendChild(messageDiv);
        conversation.scrollTop = conversation.scrollHeight;

        // Auto-remove messages after 30 seconds
        setTimeout(() => {
          if (messageDiv.parentNode) {
            messageDiv.style.opacity = '0';
            messageDiv.style.transform = 'translateY(-10px)';
            setTimeout(() => messageDiv.remove(), 300);
          }
        }, 30000);
      }

      function handleUserMessage(text) {
        const t = (text || '').trim();
        if (!t) return;

        history.push({ role: 'user', text: t });
        appendMessage('user', t);

        const response = generateReply(t);
        history.push({ role: 'ai', text: response });
        appendMessage('ai', response);
        speak(response);

        chatInput.value = '';
      }

      // Event listeners
      sendBtn.addEventListener('click', () => handleUserMessage(chatInput.value));
      chatInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          handleUserMessage(chatInput.value);
        }
      });

      // Mode switching
      function applyMode(mode, src) {
        if (mode === 'portrait') {
          if (src) portraitImg.src = src;
          document.getElementById('avatar').style.display = 'none';
          portrait.style.display = 'block';
          portrait.setAttribute('aria-hidden', 'false');
        } else {
          portrait.style.display = 'none';
          portrait.setAttribute('aria-hidden', 'true');
          document.getElementById('avatar').style.display = 'flex';
        }
        localStorage.setItem('ai_mode', mode);
        if (src) localStorage.setItem('ai_mode_image', src);
      }

      // Restore saved mode
      (function restoreMode() {
        const savedMode = localStorage.getItem('ai_mode') || 'visualizer';
        const savedSrc = localStorage.getItem('ai_mode_image') || '';
        if (modeSelect) modeSelect.value = savedMode;
        if (modeImage) modeImage.value = savedSrc;
        applyMode(savedMode, savedSrc);
      })();

      if (modeApply) {
        modeApply.addEventListener('click', () => {
          applyMode(modeSelect.value, (modeImage.value || '').trim());
        });
      }

      // Allow external control
      ipcRenderer.on('ai-set-mode', (_evt, payload) => {
        const { mode, src } = payload || {};
        if (!mode) return;
        if (modeSelect) modeSelect.value = mode;
        if (src && modeImage) modeImage.value = src;
        applyMode(mode, src);
      });

      function toggleSetting(id) {
        const options = document.getElementById(id + '-options');
        options.style.display = options.style.display === 'none' ? 'block' : 'none';
      }

      // Add hover animations and voice toggle
      function enhanceButtons() {
        const buttons = document.querySelectorAll('.btn'); // Assuming your buttons have class 'btn'
        buttons.forEach(btn => {
          btn.addEventListener('mouseenter', () => {
            btn.style.transform = 'scale(1.05)'; // Slight scale on hover
            btn.style.transition = 'transform 0.2s ease';
          });
          btn.addEventListener('mouseleave', () => {
            btn.style.transform = 'scale(1)'; // Reset
          });
        });

        // Voice toggle button (add to HTML if missing)
        const voiceToggle = document.getElementById('voice-toggle');
        if (voiceToggle) {
          voiceToggle.addEventListener('click', () => {
            // Toggle voice input/output (integrate with your TTS server)
            const isEnabled = voiceToggle.classList.toggle('enabled');
            // Add logic to enable/disable voice features
          });
        }
      }

      // Call on page load
      document.addEventListener('DOMContentLoaded', enhanceButtons);
    })();
  </script>
