<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Face 3 YouTube Downloader</title>
  <link rel="stylesheet" href="downloader.css">
</head>

<body>
  <header>Face 3 Downloader</header>
  <div class="container">
    <input type="text" id="videoUrl" placeholder="Paste YouTube URL here">
    <button id="downloadBtn">Download</button>
    <div class="progress">
      <div class="progress-bar" id="progressBar"></div>
    </div>
    <video id="player" controls></video>
  </div>
  <script src="renderer.js"></script>
</body>

</html>
